<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thoughtout Account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font:14px Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:23px;font-weight:900}.brand span{color:#eab308}.muted{color:#a1a1aa}.card{background:#111113;border:1px solid #27272a;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:16px;background:#18181b;border-radius:12px}.stat b{display:block;font-size:20px;margin-top:5px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#27272a}.paid{background:#14532d;color:#bbf7d0}.pending{background:#713f12;color:#fef08a}.btn{border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.error{color:#fca5a5}
</style></head><body><main class="wrap">
<div class="top"><div class="brand">THOUGHTOUT <span>ACCOUNT</span></div><button class="btn" id="logout">Logout</button></div>
<div id="loading" class="card">Loading your account…</div>
<div id="app" style="display:none">
<section class="card hero"><div><div id="role" class="muted"></div><h1 id="name" style="margin:6px 0 8px"></h1><div id="email" class="muted"></div></div><div id="status"></div></section>
<section class="grid" id="stats"></section>
<section class="card"><h2 style="margin-top:0">Booking / Registration</h2><div id="details"></div></section>
</div>
<div id="err" class="card error" style="display:none"></div>
</main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(v){const s=String(v||'pending');return '<span class="pill '+s.split('_')[0]+'">'+esc(s.replaceAll('_',' '))+'</span>'}
function row(k,v){return '<div style="padding:11px 0;border-bottom:1px solid #27272a"><span class="muted">'+esc(k)+'</span><br><strong>'+esc(v)+'</strong></div>'}
async function load(){try{
 const r=await fetch('/api/auth/me',{credentials:'same-origin'});const j=await r.json();if(!r.ok||!j.authenticated){location.href='/login';return}
 const x=j.record;$('loading').style.display='none';$('app').style.display='block';
 const performer=j.role==='performer';$('role').textContent=performer?'🎤 PERFORMER':'🎟 AUDIENCE / TICKET';
 $('name').textContent=performer?x.name:x.buyer_name;$('email').textContent=performer?x.email:x.buyer_email;
 $('status').innerHTML=badge(performer?x.review_status:x.payment_status);
 if(performer){$('stats').innerHTML='<div class="stat"><span class="muted">Event</span><b>'+esc(x.event_slug)+'</b></div><div class="stat"><span class="muted">Category</span><b>'+esc(x.category)+'</b></div><div class="stat"><span class="muted">Payment</span><b>'+badge(x.payment_status)+'</b></div>'; $('details').innerHTML=row('Registration ID',x.id)+row('Contact',x.contact_no)+row('Instagram',x.instagram_id)+row('Event',x.event_slug)+row('Category',x.category)+row('Payment',x.payment_status)+row('Review status',x.review_status);}
 else {$('stats').innerHTML='<div class="stat"><span class="muted">Event</span><b>'+esc(x.event_slug)+'</b></div><div class="stat"><span class="muted">Ticket</span><b>'+esc(x.tier)+'</b></div><div class="stat"><span class="muted">Amount</span><b>₹'+Number(x.amount_inr||0).toLocaleString('en-IN')+'</b></div>'; $('details').innerHTML=row('Ticket ID',x.id)+row('Contact',x.buyer_phone)+row('Event',x.event_slug)+row('Ticket tier',x.tier)+row('Payment',x.payment_status)+row('Booked',new Date(x.created_at).toLocaleString('en-IN'));}
}catch(e){$('loading').style.display='none';$('err').style.display='block';$('err').textContent=e.message||'Unable to load account.'}}
$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.href='/login'};load();
</script></body></html>
