<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thoughtout Login</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font:15px Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(460px,100%);background:#111113;border:1px solid #27272a;border-radius:18px;padding:26px;box-shadow:0 20px 70px #0008}.brand{font-size:26px;font-weight:900;letter-spacing:1px}.brand span{color:#eab308}.muted{color:#a1a1aa}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 18px}.tab{padding:12px;border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:#422006;border-color:#eab308;color:#fef08a}label{display:block;margin:14px 0 7px;color:#d4d4d8;font-size:13px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #3f3f46;background:#09090b;color:#fff;outline:none}input:focus{border-color:#eab308}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#eab308;color:#111;font-weight:900;cursor:pointer}.msg{min-height:22px;margin-top:12px}.error{color:#fca5a5}.ok{color:#86efac}.hint{font-size:12px;color:#71717a;line-height:1.5;margin-top:14px}.back{display:inline-block;margin-top:18px;color:#a1a1aa;text-decoration:none}
</style></head><body>
<div class="card">
  <div class="brand">THOUGHTOUT <span>LOGIN</span></div>
  <p id="subtitle" class="muted">Access your audience ticket.</p>
  <div class="tabs">
    <button class="tab active" data-role="audience">🎟 Audience / Ticket</button>
    <button class="tab" data-role="performer">🎤 Performer</button>
  </div>
  <form id="form">
    <label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="Your registered email">
    <label id="phoneLabel">Phone number</label><input id="phone" type="tel" required autocomplete="tel" placeholder="Your registered phone">
    <label id="idLabel">Ticket ID</label><input id="recordId" required placeholder="e.g. ticket ID">
    <button class="submit" id="submit">Login</button>
  </form>
  <div id="msg" class="msg"></div>
  <div id="hint" class="hint">Use the same email and phone number used while booking your ticket.</div>
  <a class="back" href="/">← Back to Thoughtout</a>
</div>
<script>
let role='audience';
const $=id=>document.getElementById(id);
function setRole(next){
 role=next;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.role===role));
 const performer=role==='performer';
 $('subtitle').textContent=performer?'Access your performer registration.':'Access your audience ticket.';
 $('phoneLabel').textContent=performer?'Contact number':'Phone number';
 $('idLabel').textContent=performer?'Registration ID':'Ticket ID';
 $('recordId').placeholder=performer?'e.g. registration ID':'e.g. ticket ID';
 $('hint').textContent=performer?'Use the email, contact number and registration ID from your performer registration.':'Use the same email, phone number and ticket ID used while booking your ticket.';
 $('msg').textContent='';
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
$('form').onsubmit=async e=>{
 e.preventDefault(); $('msg').className='msg'; $('msg').textContent='Checking...';
 try{
   const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({role,email:$('email').value.trim(),phone:$('phone').value.trim(),record_id:$('recordId').value.trim()})});
   const j=await r.json(); if(!r.ok) throw new Error(j.error||'Login failed');
   location.href='/account';
 }catch(err){$('msg').className='msg error';$('msg').textContent=err.message}
};
fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(x=>{if(x&&x.authenticated)location.href='/account'}).catch(()=>{});
</script></body></html>
