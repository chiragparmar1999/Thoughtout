<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thoughtout Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font:14px Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}h1,h2{margin:0}.muted{color:#a1a1aa}.brand{font-weight:900;font-size:24px}.btn{border:1px solid #3f3f46;background:#18181b;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.btn:hover{background:#27272a}.danger{border-color:#7f1d1d}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#111113;border:1px solid #27272a;border-radius:16px;padding:20px;box-shadow:0 10px 40px #0005}.login .card{width:min(420px,100%)}input{width:100%;padding:12px;border-radius:10px;border:1px solid #3f3f46;background:#09090b;color:#fff;margin:10px 0 14px;outline:none}input:focus{border-color:#eab308}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px}.stat b{display:block;font-size:28px;margin-top:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.active{border-color:#eab308;background:#422006}.panel{display:none}.panel.active{display:block}.table-wrap{overflow:auto;border:1px solid #27272a;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px;border-bottom:1px solid #27272a;text-align:left;white-space:nowrap}.table th{color:#a1a1aa;font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#27272a}.paid{background:#14532d;color:#bbf7d0}.pending{background:#713f12;color:#fef08a}.failed{background:#7f1d1d;color:#fecaca}.empty{padding:30px;text-align:center;color:#71717a}.small{font-size:12px}.error{color:#fca5a5}.ok{color:#86efac}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px}.brand{font-size:20px}}</style></head><body>
<div id="login" class="login"><div class="card"><div class="brand">THOUGHTOUT <span style="color:#eab308">ADMIN</span></div><p class="muted">Secure admin dashboard</p><form id="loginForm"><input id="key" type="password" placeholder="Admin key" autocomplete="current-password" required><button class="btn" style="width:100%">Login</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><div class="brand">THOUGHTOUT <span style="color:#eab308">ADMIN</span></div><div class="muted small">Tickets · Performers · Creator packages · Events · Gallery</div></div><button id="logout" class="btn danger">Logout</button></div>
<div class="grid"><div class="card stat"><span class="muted">Tickets</span><b id="sTickets">—</b></div><div class="card stat"><span class="muted">Performers</span><b id="sRegs">—</b></div><div class="card stat"><span class="muted">Packages</span><b id="sPackages">—</b></div><div class="card stat"><span class="muted">Paid revenue</span><b id="sRevenue">₹—</b></div></div>
<div class="tabs"><button class="btn tab active" data-tab="tickets">🎟 Tickets</button><button class="btn tab" data-tab="performers">🎤 Performers</button><button class="btn tab" data-tab="packages">🎬 Packages</button><button class="btn tab" data-tab="events">📅 Events</button><button class="btn tab" data-tab="gallery">🖼 Gallery</button><button class="btn tab" data-tab="users">👤 Google Users</button></div>
<section id="tickets" class="panel active card"><h2>Ticket bookings</h2><input class="search" data-search="tickets" placeholder="Search name, email, phone, event..."><div id="ticketsTable"></div></section>
<section id="performers" class="panel card"><h2>Performer registrations</h2><input class="search" data-search="performers" placeholder="Search name, email, category..."><div id="performersTable"></div></section>
<section id="packages" class="panel card"><h2>Creator packages</h2><input class="search" data-search="packages" placeholder="Search name, email, Instagram..."><div id="packagesTable"></div></section>
<section id="events" class="panel card"><h2>Events</h2><div id="eventsTable"></div></section>
<section id="gallery" class="panel card"><h2>Gallery</h2><div id="galleryTable"></div></section><section id="users" class="panel card"><h2>Google accounts</h2><input class="search" data-search="users" placeholder="Search name, email, role..."><div id="usersTable"></div></section></div>
<script>
const state={tickets:[],performers:[],packages:[],events:[],gallery:[],users:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₹'+Number(v||0).toLocaleString('en-IN');function badge(v){const s=String(v||'pending');return '<span class="pill '+s.split('_')[0]+'">'+esc(s.replaceAll('_',' '))+'</span>'}
async function api(url){const r=await fetch(url,{credentials:'same-origin'});if(r.status===401)throw new Error('SESSION_EXPIRED');const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function table(target,headers,rows){$(target).innerHTML=rows.length?'<div class="table-wrap"><table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="empty">No records found.</div>'}
function renderTickets(f=''){const a=state.tickets.filter(x=>JSON.stringify(x).toLowerCase().includes(f.toLowerCase()));table('ticketsTable',['Date','Buyer','Contact','Event','Tier','Amount','Payment'],a.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('en-IN'))+'</td><td>'+esc(x.buyer_name)+'<br><span class="muted small">'+esc(x.buyer_email)+'</span></td><td>'+esc(x.buyer_phone)+'</td><td>'+esc(x.event_slug)+'</td><td>'+esc(x.tier)+'</td><td>'+money(x.amount_inr)+'</td><td>'+badge(x.payment_status)+'</td></tr>'))}
function renderPerformers(f=''){const a=state.performers.filter(x=>JSON.stringify(x).toLowerCase().includes(f.toLowerCase()));table('performersTable',['Date','Name','Contact','Instagram','Category','Amount','Payment'],a.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('en-IN'))+'</td><td>'+esc(x.name)+'<br><span class="muted small">'+esc(x.email)+'</span></td><td>'+esc(x.contact_no)+'</td><td>'+esc(x.instagram_id)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount_inr)+'</td><td>'+badge(x.payment_status)+'</td></tr>'))}
function renderPackages(f=''){const a=state.packages.filter(x=>JSON.stringify(x).toLowerCase().includes(f.toLowerCase()));table('packagesTable',['Date','Buyer','Contact','Instagram','Package','Price','Status'],a.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('en-IN'))+'</td><td>'+esc(x.buyer_name)+'<br><span class="muted small">'+esc(x.buyer_email)+'</span></td><td>'+esc(x.buyer_phone)+'</td><td>'+esc(x.instagram_id||'—')+'</td><td>'+esc(x.package_name)+'</td><td>'+money(x.price_inr)+'</td><td>'+badge(x.status)+'</td></tr>'))}
function renderEvents(){table('eventsTable',['Date','Event','Slug','Status'],state.events.map(x=>'<tr><td>'+esc(x.event_date||'—')+'</td><td>'+esc(x.name||x.title||'—')+'</td><td>'+esc(x.slug||'—')+'</td><td>'+badge(x.status||'open')+'</td></tr>'))}
function renderGallery(){table('galleryTable',['Order','Title','Type','URL'],state.gallery.map(x=>'<tr><td>'+esc(x.sort_order)+'</td><td>'+esc(x.title||x.name||'—')+'</td><td>'+esc(x.media_type||x.type||'—')+'</td><td>'+esc(x.url||x.media_url||'—')+'</td></tr>'))}
function renderUsers(f=''){const a=state.users.filter(x=>JSON.stringify(x).toLowerCase().includes(f.toLowerCase()));table('usersTable',['Created','Name','Email','Role'],a.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString('en-IN'))+'</td><td>'+esc(x.full_name||'—')+'</td><td>'+esc(x.email)+'</td><td>'+badge(x.role)+'</td></tr>'))}
async function load(){try{const [t,r,p,e,g,u]=await Promise.all([api('/api/admin/tickets'),api('/api/admin/registrations'),api('/api/admin/packages'),api('/api/admin/events'),api('/api/admin/gallery'),api('/api/admin/users')]);state.tickets=t;state.performers=r;state.packages=p;state.events=e;state.gallery=g;state.users=u;$('sTickets').textContent=t.length;$('sRegs').textContent=r.length;$('sPackages').textContent=p.length;const revenue=[...t,...r].filter(x=>x.payment_status==='paid').reduce((n,x)=>n+Number(x.amount_inr||0),0)+p.filter(x=>x.status==='paid').reduce((n,x)=>n+Number(x.price_inr||0),0);$('sRevenue').textContent=money(revenue);renderTickets();renderPerformers();renderPackages();renderEvents();renderGallery();renderUsers()}catch(e){if(e.message==='SESSION_EXPIRED')showLogin('Session expired. Please login again.');else alert(e.message)}}
function showLogin(msg=''){$('app').classList.add('hidden');$('login').classList.remove('hidden');if(msg){$('loginMsg').className='error';$('loginMsg').textContent=msg}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Checking...';try{const r=await fetch('/api/admin/verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({key:$('key').value})});const j=await r.json();if(!r.ok||!j.valid)throw new Error(j.error||'Invalid admin key');$('key').value='';showApp()}catch(e){$('loginMsg').className='error';$('loginMsg').textContent=e.message}});
$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'});showLogin()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
document.querySelectorAll('[data-search]').forEach(i=>i.addEventListener('input',()=>({tickets:renderTickets,performers:renderPerformers,packages:renderPackages,users:renderUsers}[i.dataset.search])(i.value)));
fetch('/api/health').then(r=>r.json()).then(h=>{if(h.admin_configured)showLogin();else showLogin('ADMIN_KEY is not configured in Vercel environment variables.')}).catch(()=>showLogin('Unable to reach server.'));
</script></body></html>
