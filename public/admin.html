<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThoughtOut Admin</title><style>body{font-family:Arial;background:#09090b;color:#fff;padding:30px;max-width:900px;margin:auto}.btn{padding:12px 18px;background:#e8ff3d;border:0}.card{background:#17171a;padding:20px;margin:12px 0;border-radius:8px}input{padding:12px;width:100%;margin:8px 0}</style></head><body><h1>THOUGHTOUT ADMIN</h1><input id="key" type="password" placeholder="Admin key"><button class="btn" onclick="login()">LOGIN</button><div id="out"></div><script>async function login(){let key=document.getElementById('key').value;let r=await fetch('/api/admin/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});let j=await r.json();if(!j.valid){out.innerHTML='<div class="card">Invalid admin key.</div>';return}out.innerHTML='<div class="card">Authenticated. Loading dashboard…</div>';let [e,t,p,g]=await Promise.all(['events','tickets','registrations','gallery'].map(x=>fetch('/api/admin/'+x,{headers:{'x-admin-key':key}}).then(r=>r.json())));out.innerHTML='<div class="card"><b>Events:</b> '+e.length+'</div><div class="card"><b>Tickets:</b> '+t.length+'</div><div class="card"><b>Performers:</b> '+p.length+'</div><div class="card"><b>Gallery:</b> '+g.length+'</div>'}</script></body></html>
